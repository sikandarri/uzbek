name: Noldan Ravon MongoDB Phase 1 checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/noldan_ci_test?replicaSet=rs0&directConnection=true
      INTEGRATION_DATABASE_URL: mongodb://127.0.0.1:27017/noldan_ci_test?replicaSet=rs0&directConnection=true
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start a local MongoDB replica set
        run: |
          docker run -d --name noldan-mongo-ci -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 40); do
            docker exec noldan-mongo-ci mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1 && break
            sleep 2
          done
          docker exec noldan-mongo-ci mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 40); do
            docker exec noldan-mongo-ci mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true && break
            sleep 2
          done
      - run: npm ci --include=dev
      - run: npm run db:generate
      - run: npm run check
      - run: npm run db:sync
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npm run test:integration
      - run: npm audit --omit=dev --audit-level=high
